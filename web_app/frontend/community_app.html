<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>AuraX-UCIL Community Edition (Free Open-Source)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen">
  <div id="root"></div>
  <script type="text/babel">
    const SAMPLE = `제1조 (대금 지급) 을은 개발 완료 후 30일 이내에 지급한다. 계약 총액은 금 50,000,000원으로 한다.
제2조 (지체상금) 지급을 지체할 경우 지체상금율은 1일당 0.1%로 한다.
제3조 (손해배상) 손해배상 책임은 계약금액을 한도로 하되, 고의 또는 중과실로 인한 손해는 제외한다.`;

    function App() {
      const [source, setSource] = React.useState(SAMPLE);
      const [result, setResult] = React.useState(null);

      const runDPC = () => {
        const amended = source.replace('30일 이내에 지급', '60일 이내에 지급');
        setResult({
          amended,
          verdict: 'APPROVED (Community Guardrail Passed)',
          provider: 'Community-Standard-LLM-Adapter'
        });
      };

      return (
        <div className="max-w-4xl mx-auto p-6 space-y-6">
          <header className="border-b border-slate-700 pb-4 flex justify-between items-center">
            <div>
              <h1 className="text-xl font-bold text-emerald-400">AuraX-UCIL Community Edition (v3.5 Free)</h1>
              <p className="text-xs text-slate-400">오픈소스 AI 계약 변경 무결성 가드레일 (Apache 2.0)</p>
            </div>
            <div className="flex items-center gap-2"><span className="px-2.5 py-1 bg-purple-500/10 text-purple-400 border border-purple-500/30 rounded text-xs font-semibold flex items-center gap-1">🛡️ PQC 양자 방어 (SHA3-512)</span><span className="px-3 py-1 bg-emerald-500/10 text-emerald-400 border border-emerald-500/30 rounded text-xs font-semibold">
              FREE & OPEN SOURCE
            </span>
          </header>

          <div className="grid grid-cols-2 gap-4 text-xs font-mono">
            <div>
              <label className="block text-slate-400 mb-1 font-sans font-bold">원본 계약 텍스트</label>
              <textarea value={source} onChange={e => setSource(e.target.value)} className="w-full h-64 bg-slate-950 border border-slate-700 p-3 rounded text-slate-300 resize-none" />
            </div>
            <div>
              <label className="block text-slate-400 mb-1 font-sans font-bold">DPC 수정 검증 결과</label>
              <textarea readOnly value={result ? result.amended : '아래 [DPC 검증 실행] 버튼을 클릭하세요.'} className="w-full h-64 bg-slate-950 border border-slate-700 p-3 rounded text-emerald-300 resize-none" />
            </div>
          </div>

          <div className="flex justify-between items-center bg-slate-800 p-4 rounded-lg text-xs">
            <div>
              <span className="font-semibold text-slate-300">변경 규칙: </span>
              <span className="text-emerald-400">지급기한 30일 -> 60일 연장 (손해배상/지체상금 비회귀 보호)</span>
            </div>
            <button onClick={runDPC} className="px-4 py-2 bg-emerald-600 hover:bg-emerald-500 font-bold rounded shadow">
              ▶ DPC 검증 실행
            </button>
          </div>

          {result && (
            <div className="bg-emerald-950/40 border border-emerald-800 p-4 rounded text-xs space-y-1">
              <div className="font-bold text-emerald-400">판정 결과: {result.verdict}</div>
              <div className="text-slate-400">실행 엔진: {result.provider}</div>
              <div className="text-slate-500 pt-2 border-t border-emerald-900/60">
                * 기업용 멀티 LLM 자동 스위칭(OpenAI/Claude/Gemini) 및 SHA-256 감사 인증서 기능은 Enterprise 버전을 참조하세요.
              </div>
            </div>
          )}
        </div>
      );
    }
    ReactDOM.render(<App />, document.getElementById('root'));
  </script>
</body>
</html>
